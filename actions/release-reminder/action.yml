name: "Release Reminder"
description: "PRに前回リリース以降のマージ済みPR数をコメント"

inputs:
  threshold:
    description: "リリース推奨のPR件数閾値"
    required: false
    default: "10"
  github-token:
    description: "pull-requests:write 権限のあるトークン"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        THRESHOLD: ${{ inputs.threshold }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/../_lib/common.sh"

        require_token "$GITHUB_TOKEN_INPUT" "github-token" "pull-requests:write"
        require_commands jq gh

        if [ -z "$PR_NUMBER" ]; then
          fail "PR 番号を取得できません" \
            "この Action は github.event.pull_request.number を使うため、pull_request イベントでのみ動作します" \
            "対処: ワークフローのトリガーを \`on: pull_request\` にしてください"
        fi

        if ! echo "$THRESHOLD" | grep -qE '^[0-9]+$'; then
          fail "threshold の値 '${THRESHOLD}' は数値ではありません" \
            "マージ済み PR 件数と比較するため、0 以上の整数が必要です" \
            "対処: 呼び出し側ワークフローの threshold 入力を見直してください"
        fi

    - name: Check and comment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        EVENT_ACTION: ${{ github.event.action }}
        THRESHOLD: ${{ inputs.threshold }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/../_lib/common.sh"

        MARKER="<!-- release-reminder-bot -->"

        # リリース PR 自身にはコメントしない
        case "$HEAD_REF" in
          release/v*)
            echo "Release PR ($HEAD_REF), skipping"
            exit 0
            ;;
        esac

        LAST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          echo "No previous release found, skipping"
          exit 0
        fi

        # 検査する PR 件数の上限。ここに達したら実数は数えず「N 件以上」と表示する
        MAX_PRS=100

        LAST_DATE=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)
        if ! PR_JSON=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main \
          --search "merged:>=${LAST_DATE}" --limit "$MAX_PRS" --json number,title 2>&1); then
          fail "マージ済み PR の一覧を取得できませんでした" \
            "gh の出力: $(echo "$PR_JSON" | head -3 | tr '\n' ' ')" \
            "対処: github-token に pull-requests:read 以上の権限があるか確認してください"
        fi
        COUNT=$(echo "$PR_JSON" | jq 'length')
        if [ "$COUNT" -ge "$MAX_PRS" ]; then
          COUNT_TEXT="${MAX_PRS} 件以上"
        else
          COUNT_TEXT="${COUNT} 件"
        fi
        PR_LIST=$(echo "$PR_JSON" | jq -r \
          --arg repo "$GITHUB_REPOSITORY" \
          '.[] | "- [#\(.number)](https://github.com/\($repo)/pull/\(.number)) \(.title)"')

        BODY="$MARKER"
        if [ "$COUNT" -eq 0 ]; then
          BODY+=$'\n'"**Release Reminder**: 前回リリース \`${LAST_TAG}\` 以降にマージされた PR はありません。"
        else
          BODY+=$'\n'"**Release Reminder**: 前回リリース \`${LAST_TAG}\` から **${COUNT_TEXT}**の PR がマージされています。"
          if [ "$COUNT" -ge "$THRESHOLD" ]; then
            BODY+=$'\nリリースを検討してください。'
          fi
          if [ "$COUNT" -ge "$MAX_PRS" ]; then
            BODY+=$'\n\n'"<details><summary>マージ済み PR 一覧（うち ${MAX_PRS} 件）</summary>"$'\n\n'
          else
            BODY+=$'\n\n<details><summary>マージ済み PR 一覧</summary>\n\n'
          fi
          BODY+="$PR_LIST"
          BODY+=$'\n\n</details>'
        fi

        # synchronize の場合は既存コメントを更新
        if [ "$EVENT_ACTION" = "synchronize" ]; then
          COMMENT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
            | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY"
            echo "Updated existing comment $COMMENT_ID"
            exit 0
          fi
          echo "No existing comment found, creating new one"
        fi

        if ! COMMENT_OUT=$(gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY" 2>&1); then
          fail "PR #${PR_NUMBER} にコメントできませんでした" \
            "gh の出力: $(echo "$COMMENT_OUT" | head -3 | tr '\n' ' ')" \
            "対処: ワークフローの permissions に pull-requests: write があるか確認してください"
        fi
