name: "Publish Release"
description: "タグ・GitHub Release 作成とリリースブランチ削除を行う共通 Composite Action"

inputs:
  branch:
    description: "マージされたリリースブランチ名 (e.g. release/v1.3.0)"
    required: true
  pr-body:
    description: "PR のボディ (リリースノート)"
    required: true
  update-major-tag:
    description: "メジャーバージョンタグを更新するか (true/false)"
    default: "false"
  assets:
    description: "添付するファイルのパスを改行区切りで指定（glob 不可）。空なら従来どおり即公開"
    default: ""
  target-commit:
    description: "リリース対象の完全なコミット SHA。空なら github.sha"
    default: ""
  github-token:
    description: "contents:write 権限の PAT"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRANCH: ${{ inputs.branch }}
        PR_BODY: ${{ inputs.pr-body }}
        UPDATE_MAJOR_TAG: ${{ inputs.update-major-tag }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        TARGET_COMMIT: ${{ inputs.target-commit || github.sha }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/../_lib/common.sh"

        require_token "$GITHUB_TOKEN_INPUT" "github-token" "contents:write"
        require_commands git gh

        if [ -z "$BRANCH" ]; then
          fail "branch が空です" \
            "リリースするバージョンをブランチ名から取り出すため、branch は必須です" \
            "対処: 呼び出し側で \`\${{ github.event.pull_request.head.ref }}\` などを渡してください"
        fi

        if ! echo "$BRANCH" | grep -qE '^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
          fail "branch '${BRANCH}' は release/vX.Y.Z の形式ではありません" \
            "この Action はブランチ名からリリースするバージョンを取り出します" \
            "対処: リリース PR 以外でこの Action が動いていないか、呼び出し側ワークフローの条件を確認してください"
        fi

        case "$UPDATE_MAJOR_TAG" in
          true|false) ;;
          *) fail "update-major-tag の値 '${UPDATE_MAJOR_TAG}' は指定できません" \
               "指定できるのは true または false です" \
               "対処: 呼び出し側ワークフローの update-major-tag 入力を見直してください" ;;
        esac

        if ! [[ "$TARGET_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
          fail "target-commit は完全なコミット SHA で指定してください" \
            "取得値: ${TARGET_COMMIT}" \
            "対処: 成果物のビルドに使ったコミット SHA を渡してください"
        fi

        if [ -z "$PR_BODY" ]; then
          echo "::notice::pr-body が空のため、リリースノートが空の GitHub Release を作成します"
        fi

    - name: Verify token
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/../_lib/common.sh"

        if ! REPO_JSON=$(gh api "repos/${GITHUB_REPOSITORY}" 2>&1); then
          fail "github-token でリポジトリ ${GITHUB_REPOSITORY} にアクセスできません" \
            "API の応答: $(echo "$REPO_JSON" | head -3 | tr '\n' ' ')" \
            "トークンの期限切れ・失効、またはこのリポジトリがトークンのスコープ外である可能性があります" \
            "対処: contents:write を持つ有効な PAT を再登録してください"
        fi

    - name: Stage release assets before checkout
      id: assets
      if: inputs.assets != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RELEASE_ASSETS: ${{ inputs.assets }}
      run: bash "${ACTION_PATH}/stage-assets.sh"

    - uses: actions/checkout@v4
      with:
        token: ${{ inputs.github-token }}
        ref: ${{ inputs.target-commit || github.sha }}
        fetch-depth: 0

    - name: Extract version from branch name
      id: version
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        VERSION="${BRANCH#release/}"
        echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "major=v$(echo ${VERSION#v} | cut -d. -f1)" >> "$GITHUB_OUTPUT"

    - name: Create tag and push
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TAG: ${{ steps.version.outputs.tag }}
        ASSET_DIR: ${{ steps.assets.outputs.directory }}
      run: bash "${ACTION_PATH}/create-tag.sh"

    - name: Create GitHub Release
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ steps.version.outputs.tag }}
        BODY: ${{ inputs.pr-body }}
        ASSET_DIR: ${{ steps.assets.outputs.directory }}
      run: bash "${ACTION_PATH}/publish.sh"

    - name: Update major version tag
      if: inputs.update-major-tag == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MAJOR: ${{ steps.version.outputs.major }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/../_lib/common.sh"

        git tag -f "$MAJOR"
        if ! PUSH_OUT=$(git push origin "$MAJOR" --force 2>&1); then
          fail "メジャーバージョンタグ ${MAJOR} を更新できませんでした" \
            "git の出力: $(echo "$PUSH_OUT" | grep -v '^remote: *$' | tail -3 | tr '\n' ' ')" \
            "タグの強制更新が保護ルールで禁止されている可能性があります" \
            "対処: Settings → Rules のタグ保護設定を確認するか、update-major-tag を false にしてください"
        fi

    - name: Delete release branch
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        source "${ACTION_PATH}/../_lib/common.sh"

        if ! ERROR=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>&1); then
          if echo "$ERROR" | grep -q "Not Found\|Reference does not exist"; then
            echo "::notice::ブランチ ${BRANCH} は既に削除されているためスキップします"
          else
            fail "リリースブランチ ${BRANCH} を削除できませんでした" \
              "API の応答: $(echo "$ERROR" | head -3 | tr '\n' ' ')" \
              "タグと GitHub Release の作成は完了しているため、リリース自体は成立しています" \
              "対処: ブランチ保護設定を確認し、${BRANCH} を手動で削除してください"
          fi
        fi
